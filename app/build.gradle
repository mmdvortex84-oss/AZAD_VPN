plugins { id 'com.android.application' }

android {
    namespace 'com.azad.vpn'
    compileSdk 35
    defaultConfig {
        applicationId 'com.azad.vpn'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha'
    }
}

dependencies {
    // sing-box Android engine library. The first milestone implements profile import/UI;
    // VPN tunnel lifecycle is intentionally not reported as connected until fully wired.
    implementation 'com.github.singbox-android:libbox:1.14.4'
}
